[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nubbix-support-ai"
version = "0.1.0"
description = "Typed support assistant with a local evaluation and tracing laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.15,<3", "google-genai>=1.60,<3", "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3", "PyYAML>=6,<7", "fastapi>=0.119,<1",
  "uvicorn>=0.35,<1", "filelock>=3.20,<5", "anyio>=4.0,<5",
]

[project.scripts]
nubbix = "nubbix_support_ai.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "pytest-socket>=0.7,<1",
  "httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.18,<3", "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nubbix_support_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".superpowers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/nubbix_support_ai"]
